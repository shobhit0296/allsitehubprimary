<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ab52" />
      <stop offset="100%" stop-color="#e8943a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(232, 148, 58, 0.25)" stroke-width="8" />

  <!-- Play Symbol / Brand Accent -->
  <g transform="translate(256, 256)">
    <!-- Outer Ring -->
    <circle r="160" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="800" opacity="0.4" />
    
    <!-- Play Triangle -->
    <path d="M-40 -80 L100 0 L-40 80 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>
</svg>
