<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>

    <!-- Main Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glowing Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Background Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#3b82f6" opacity="0.18" filter="url(#subtleGlow)"/>
  <circle cx="256" cy="256" r="100" fill="#a855f7" opacity="0.14" filter="url(#subtleGlow)"/>

  <!-- Orbital Discovery Ring -->
  <ellipse cx="256" cy="260" rx="170" ry="60" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-dasharray="14 10" opacity="0.4" transform="rotate(-25 256 260)"/>
  <ellipse cx="256" cy="260" rx="170" ry="60" fill="none" stroke="url(#brandGrad)" stroke-width="16" stroke-linecap="round" transform="rotate(-25 256 260)"/>

  <!-- Orbiting Node Dot -->
  <circle cx="110" cy="200" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="400" cy="320" r="18" fill="#a855f7" filter="url(#glow)"/>

  <!-- Central Stylized 'A' Crest -->
  <path d="M 256 108 L 150 380 L 208 380 L 236 300 L 276 300 L 304 380 L 362 380 Z M 256 180 L 268 250 L 244 250 Z" 
        fill="url(#brandGrad)" filter="url(#glow)"/>

  <!-- Inner Spark / Prism Crossbeam -->
  <path d="M 200 310 Q 256 280 312 310" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Top Crown Node -->
  <circle cx="256" cy="108" r="12" fill="#ffffff" filter="url(#glow)"/>
</svg>
