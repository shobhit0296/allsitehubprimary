name: 30-Minute Uptime Sentinel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  uptime-check:
    runs-on: ubuntu-latest
    steps:
      - name: Health Probe
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Probing website services every 30 minutes..."
